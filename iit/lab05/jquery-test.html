<!DOCTYPE html>
<html>
<head>
<title>jQuery Test</title>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
$(document).ready(function(){
    $("button").click(function(){
        $("p").hide();
    });
});
</script>

</head>

<body>

<p>This paragraph should disappear.</p>
<button>Click me</button>

</body>
</html>
